name: Render Keep Alive Ping

on:
  schedule:
    # Har 10 minute me trigger hoga
    - cron: '*/10 * * * *'
  workflow_dispatch: # Manual run button bhi dega

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -s -f -m 30 "https://raftraone.onrender.com/health" || echo "Ping failed or server waking up"
