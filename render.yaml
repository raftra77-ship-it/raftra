# Render blueprint for the Raftra API.
#
# Deploys the FastAPI backend only — the frontend stays on Vercel, which proxies
# /api/* here (see vercel.json).
#
# Uses requirements-deploy.txt rather than requirements.txt: the full file pulls
# sentence-transformers, which drags in torch (490MB), scipy, transformers, sklearn
# and sympy — roughly 800MB of the 1.4GB install, for the Qdrant-backed knowledge
# base only. That feature already needs a Qdrant instance that isn't deployed, so
# shipping the model stack now costs build time and memory for nothing. Add
# sentence-transformers back (and drop SKIP_EMBEDDING_PRELOAD) when Qdrant exists.
services:
  - type: web
    name: raftra-api
    runtime: python
    rootDir: backend
    # Free tier: 512MB RAM, and the service sleeps after ~15 minutes idle so the first
    # request afterwards takes 30-60s to wake. That is fine for testing and for the OAuth
    # callbacks. Dropping sentence-transformers (see requirements-deploy.txt) is what keeps
    # this within 512MB. Move to `starter` before real traffic, or before a Meta/Google
    # reviewer tests the app — a cold-start timeout reads as a broken product.
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # /health answers without touching the database or building the OpenAPI schema, so a
    # cold instance passes its health check as soon as uvicorn is up.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9      # matches backend/.python-version

      # Skips the embedding model warmup at startup. Without this the preload
      # thread logs a caught ImportError on every boot.
      - key: SKIP_EMBEDDING_PRELOAD
        value: "1"

      # ── Set these in the Render dashboard, not here. Never commit secrets. ──
      # Copy the values from backend/.env, EXCEPT the three URLs below, which
      # must point at production rather than localhost.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      # Encrypts connector credentials at rest. Must match backend/.env exactly — if this
      # differs from the key a row was written with, that connection cannot be decrypted
      # and the customer has to reconnect.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: VIDEO_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_REPLY_TO
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: WPCOM_CLIENT_ID
        sync: false
      - key: WPCOM_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Required for the payment.captured / order.paid webhooks, which credit customers who pay
      # and close the tab before the browser confirms. Without it the API refuses webhooks
      # (503) rather than trusting unsigned events. Create the webhook in Razorpay Dashboard ->
      # Settings -> Webhooks: URL https://raftra-api.onrender.com/api/payments/webhook, events
      # payment.captured, order.paid, payment.failed; use the same secret here.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SUBSCRIPTION_PRICE_INR   # defaults to 2000
        sync: false
      - key: MAX_TOPUP_INR            # defaults to 500000
        sync: false

      # ── These three MUST change from the localhost values in backend/.env ──
      # BACKEND_URL drives every OAuth redirect URI, so it has to be the public
      # Render URL or callbacks will point at localhost and fail.
      #   BACKEND_URL   = https://raftra-api.onrender.com   (this service's URL)
      #   FRONTEND_URL  = https://raftra.vercel.app
      #   CORS_ORIGINS  = https://raftra.vercel.app
      - key: BACKEND_URL
        sync: false
      # Where Google returns the user after sign-in. Set to the app's own origin
      # (https://raftra-wmlp.vercel.app) so the round trip never shows this API host —
      # Vercel proxies /api/* here, so the callback still reaches this service. The same
      # URL must be registered in Google Cloud.
      - key: OAUTH_REDIRECT_BASE
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # Rate limiting (middleware.py) needs Redis. It was never declared here, so
      # REDIS_URL has been unset in production and the limiter fails open on every
      # request — after five failures it disables itself for the process. That leaves
      # /api/auth/login with no brute-force protection and the LLM endpoints with no
      # cap. Point this at a Render Redis or Upstash instance; until it is set the API
      # runs with no rate limiting at all.
      - key: REDIS_URL
        sync: false

      # Vector store for the RAG index (core/vector_store.py). Both of these have
      # working auto-detected defaults, and are declared so the deploy states them
      # rather than relying on inference:
      #   VECTOR_BACKEND     = pgvector   (Postgres + pgvector 0.8.2, already installed
      #                                    on the Supabase instance. 'qdrant' is the
      #                                    alternative and needs a reachable QDRANT_URL,
      #                                    which no deployed instance has.)
      #   EMBEDDING_PROVIDER = gemini     (hosted embeddings; 'local' needs
      #                                    sentence-transformers, which requirements-deploy
      #                                    omits because torch does not fit in 512MB)
      - key: VECTOR_BACKEND
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false

      # Media storage for the Asset Vault: device uploads, Google Drive imports and the copies
      # of Meta ad creatives. Without these, files go to the instance's local disk, which
      # Render wipes on every deploy and restart - the vault then shows broken images. The
      # API logs a WARNING at boot when they are missing.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET        # defaults to raftra-media; the bucket must be public-read
        sync: false

      # "Import from Meta Ads" -> public Ad Library half. Optional: without it the import still
      # reads the connected ad account and says the Ad Library was not searched.
      - key: APIFY_TOKEN
        sync: false
      - key: DEFAULT_MARKET_COUNTRY # ISO code for Ad Library searches, defaults to IN
        sync: false

      # Both long-running imports answer inside Vercel's 120s proxy limit by default
      # (harvest 55s, Ad Library run 60s). Only raise these if the frontend calls the API
      # directly rather than through the Vercel /api rewrite.
      - key: HARVEST_BUDGET_SECONDS
        sync: false
      - key: APIFY_VAULT_TIMEOUT_SECONDS
        sync: false

# ── Vercel (frontend) environment variables ──────────────────────────────────────────
# Set in the Vercel project settings; they are inlined at build time, so redeploy after
# changing them.
#   VITE_WS_URL          = wss://raftra-api.onrender.com/ws
#                          Vercel rewrites do not proxy WebSocket upgrades. Without this the
#                          agent activity feed and brand<->creator chat never connect.
#   VITE_RAZORPAY_KEY_ID = the public Razorpay key id
