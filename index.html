<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Raftra logo. The old public/favicon.svg was Vite's default lightning-bolt logo, which
       is what showed in the browser tab. favicon.ico first for browsers and crawlers that
       request /favicon.ico directly; the PNGs cover high-DPI tabs and iOS home screens. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030303" />

  <!-- Fonts: preconnect opens the TCP/TLS handshake to both Google font hosts before the
       stylesheet is even requested. Lighthouse reported "no origins were preconnected"
       and flagged fonts.gstatic.com as the top candidate. Loading via <link> here rather
       than an @import in index.css also removes a request chain — the @import could not
       start until index.css had been downloaded and parsed. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" />

  <title>Raftra AI — Growth Operating System for Premium Brands</title>
  <meta name="description"
    content="Raftra AI is an AI Growth Operating System: create ads, launch campaigns across Meta and Google, rank on Google and AI search, track analytics, manage social, and hire verified influencers — from one platform." />

  <!-- Link previews for shared URLs (Slack, WhatsApp, X, LinkedIn). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Raftra AI" />
  <meta property="og:title" content="Raftra AI — Growth Operating System for Premium Brands" />
  <meta property="og:description"
    content="Your entire growth team, powered by AI. Ads, campaigns, SEO + GEO, analytics, social and influencers in one workspace." />
  <!-- Raster, 1200x630: WhatsApp, Slack and LinkedIn previews do not render SVG. -->
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/og-image.png" />
  <meta name="twitter:title" content="Raftra AI — Growth Operating System for Premium Brands" />
  <meta name="twitter:description"
    content="Your entire growth team, powered by AI. Ads, campaigns, SEO + GEO, analytics, social and influencers in one workspace." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
